<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vampire World - Pro HTML5 Playable</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="topHud">
      <div class="hudPill">
        <img class="hudIcon" src="assets/ui/icon_coin.webp" alt="" onerror="this.style.display='none'">
        <span id="coinsText">0</span>
      </div>
      <div class="hudPill"><span class="heartIcon"></span><span id="baseText">Base 100%</span></div>
    </div>

    <button id="installBtn" type="button">INSTALLER</button>

    <div id="bottomHud">
      <div id="hintBox">
        <strong>Vampire World</strong>
        <span>Déplace ton doigt. Le héros suit en direct. Tue les vampires, récupère les pièces et construis des tours.</span>
      </div>

      <div id="actionPanel">
        <button id="buildTowerBtn" type="button">
          <img src="assets/ui/icon_build_tower.webp" alt="" onerror="this.style.display='none'">
          <span>Tour</span><small>50</small>
        </button>
        <button id="upgradeBaseBtn" type="button">
          <img src="assets/ui/icon_upgrade_base.webp" alt="" onerror="this.style.display='none'">
          <span>Base</span><small>100</small>
        </button>
        <button id="waveBtn" type="button"><span>Vague</span><small>Danger</small></button>
      </div>
    </div>

    <div id="endCard">
      <div class="endCardBox">
        <h1>Défends ta base</h1>
        <p>Repousse les vampires, construis des tours et améliore ton camp avant la prochaine vague.</p>
        <button id="continueBtn" type="button">Continuer</button>
      </div>
    </div>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
