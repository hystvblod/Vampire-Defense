<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vampire World - Test HTML5</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="topHud">
      <div class="hudPill">🪙 <span id="coinsText">0</span></div>
      <div class="hudPill">❤️ <span id="baseText">Base 100%</span></div>
    </div>

    <button id="installBtn">INSTALLER</button>

    <div id="bottomHud">
      <div id="hintBox">
        <strong>Test jouable HTML5</strong>
        <span>Déplace ton doigt. Le héros suit. Tue les vampires, récupère les pièces et construis des tours.</span>
      </div>

      <div id="actionPanel">
        <button id="buildTowerBtn"><span>Tour</span><small>50 pièces</small></button>
        <button id="upgradeBaseBtn"><span>Base</span><small>100 pièces</small></button>
        <button id="waveBtn"><span>Vague</span><small>Danger</small></button>
      </div>
    </div>

    <div id="endCard">
      <div class="endCardBox">
        <h1>Défends ta base</h1>
        <p>Repousse les vampires, construis des tours et améliore ton camp avant la prochaine vague.</p>
        <button id="continueBtn">Continuer</button>
      </div>
    </div>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
